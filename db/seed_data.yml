session_templates:
  keynote: &keynote
    title: "Keynote: Ruby for the Long Haul"
    description: "A practical look at designing Ruby applications that stay pleasant to change over a decade."
    session_type: 0
    audience_level: 0
  hotwire: &hotwire
    title: "Hotwire Without the Mystery"
    description: "Build a responsive interface by following the request, response, and DOM lifecycle end to end."
    session_type: 1
    audience_level: 1
  queue: &queue
    title: "The Queue Is the Product"
    description: "Use Active Job boundaries, retries, and observability to make asynchronous work dependable."
    session_type: 1
    audience_level: 2
  testing: &testing
    title: "Testing the Edges"
    description: "Find the handful of integration tests that make a Rails application safe to refactor."
    session_type: 2
    audience_level: 1
  postgres: &postgres
    title: "Postgres Patterns for Rails Teams"
    description: "Reach for indexes, constraints, and query plans before reaching for a cache."
    session_type: 1
    audience_level: 2
  ractors: &ractors
    title: "A Gentle Introduction to Ractors"
    description: "Explore Ruby concurrency with a small, concrete system and its trade-offs."
    session_type: 1
    audience_level: 3
  gems: &gems
    title: "Shipping Gems with Confidence"
    description: "Versioning, compatibility, and release automation for maintainers of useful libraries."
    session_type: 2
    audience_level: 2
  components: &components
    title: "View Components That Age Well"
    description: "Keep presentation code explicit without turning a component library into a framework."
    session_type: 1
    audience_level: 1
  incidents: &incidents
    title: "Incident Reviews Without Blame"
    description: "Turn production surprises into durable improvements for both systems and teams."
    session_type: 2
    audience_level: 2
  performance: &performance
    title: "Rails Performance Field Notes"
    description: "A tour of real bottlenecks, from N+1 queries to slow template rendering."
    session_type: 1
    audience_level: 2
  office_hours: &office_hours
    title: "Open Source Office Hours"
    description: "Bring a maintainer question, a patch idea, or simply listen in on the craft of stewardship."
    session_type: 3
