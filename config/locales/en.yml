# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  time:
    formats:
      admin_custom: "%b %-d, %Y %I:%M%p %Z"
  activerecord:
    errors:
      models:
        session_speaker:
          attributes:
            session_id:
              taken: "has already been assigned to speaker"
  activemodel:
    errors:
      models:
        conference_cloner:
          attributes:
            end_date:
              before_start_date: "must be on or after the start date"
  admin:
    conference:
      readiness:
        title: "Publish readiness: %{name}"
        ready: "Ready to publish"
        blocked: "Changes needed before publishing"
        description: "All checks must pass when publishing through the conference form, action button, or batch action. Cancelled sessions are excluded. Drafts can be saved while their program is incomplete."
        program_summary:
          one: "%{count} active session. Dates are checked in %{time_zone}."
          other: "%{count} active sessions. Dates are checked in %{time_zone}."
        checks:
          speakers: "Every active session has at least one speaker."
          times: "Session end times follow their start times."
          dates: "Session start and end dates fall within the conference dates in the venue's time zone."
          rooms: "Each session's room belongs to the conference venue."
        fix_heading:
          one: "%{count} issue to resolve"
          other: "%{count} issues to resolve"
        edit_session: "Edit %{title}"
        add_session: "Add Session"
        edit_conference: "Edit Conference"
        back: "Back to Conference"
        publish_blocked: "The conference cannot be published until the readiness issues are resolved."
        issues:
          empty_program: "Add at least one active session to the conference."
          invalid_dates: "Set conference dates with the end date on or after the start date."
          missing_venue: "Choose a venue for the conference."
          missing_speakers: "%{title} has no speakers assigned."
          invalid_times: "%{title} must have an end time after its start time."
          outside_dates: "%{title} starts or ends outside the conference dates."
          wrong_venue: "%{title} needs a room at the conference venue."
      clone:
        title: "Clone %{name} as a draft"
        default_name: "%{name} (copy)"
        description: "Copy the conference and all its sessions as unpublished drafts at the same venue. Session dates shift relative to the new start date, keeping the venue's local times. Rooms and existing speakers are reused. Review the program if you change the conference's duration."
        name: "Name"
        slug: "Slug"
        start_date: "New start date"
        end_date: "New end date"
        include_speakers: "Copy speaker assignments"
        submit: "Create draft copy"
        notice: "The draft conference and its sessions have been copied."
        invalid_copy: "The conference could not be copied: %{errors}"
      batch_actions:
        toggle_published_confirmation: "Are you sure you want to toggle the published status for the selected conferences?"
        toggle_published_notice: "The conferences' published status has been toggled."
        toggle_published_blocked: "No conferences were changed. Resolve the readiness issues before retrying the batch action."
      action_items:
        clone: "Clone as Draft"
        readiness: "Publish Readiness"
        publish: "Publish Conference"
        toggle_published_notice: "The conference's published status has been toggled."
        unpublish: "Unpublish Conference"
    session:
      form:
        speakers: "Speakers"
      action_items:
        cancel: "Cancel Session"
        cancelled_notice: "The session has been cancelled."
      batch_actions:
        update_session_details_invalid: "Invalid session details. No sessions were updated."
        update_session_details_notice: "The sessions have been updated."
