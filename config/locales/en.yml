# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  time:
    formats:
      admin_custom: "%b %-d, %Y %I:%M%p %Z"
  activerecord:
    errors:
      models:
        session_speaker:
          attributes:
            session_id:
              taken: "has already been assigned to speaker"
  admin:
    conference:
      batch_actions:
        toggle_published_confirmation: "Are you sure you want to toggle the published status for the selected conferences?"
        toggle_published_notice: "The conferences' published status has been toggled."
      action_items:
        publish: "Publish Conference"
        toggle_published_notice: "The conference's published status has been toggled."
        unpublish: "Unpublish Conference"
    session:
      action_items:
        cancel: "Cancel Session"
        cancelled_notice: "The session has been cancelled."
      batch_actions:
        update_session_details_invalid: "Invalid session details. No sessions were updated."
        update_session_details_notice: "The sessions have been updated."
