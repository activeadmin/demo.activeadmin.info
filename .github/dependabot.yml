version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github_actions:
        patterns:
          - "*"
    cooldown:
      default-days: 5
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    # json 3.x is incompatible with the current Rails release, see rails/rails#58601
    ignore:
      - dependency-name: json
        update-types:
          - version-update:semver-major
    groups:
      bundler:
        patterns:
          - "*"
    cooldown:
      default-days: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 5
