version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github_actions:
        patterns:
          - "*"
    cooldown:
      default-days: 5
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    groups:
      bundler:
        patterns:
          - "*"
    cooldown:
      default-days: 5
    ignore:
      - dependency-name: "ransack"
        versions: [">= 6.0.0"]
        # TODO: remove when https://github.com/activeadmin/activeadmin/issues/9135 is resolved
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 5
